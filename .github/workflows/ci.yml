name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scope guard (rear camera only)
        run: node scripts/scope-guard.mjs
      - name: Privacy check
        run: node scripts/priv-check.mjs
      - name: Style check
        run: node scripts/check-style.mjs
      - name: Contrast (UI-3)
        run: node scripts/check-contrast.mjs
      - name: Lock-screen and notification copy (WID-2)
        run: node scripts/check-notification-copy.mjs
      - name: Diabetes wording
        run: node scripts/check-diabetes-copy.mjs
      - name: Brand (BRAND-1)
        run: |
          node scripts/check-logo.mjs
          node scripts/check-assets.mjs
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            node scripts/check-commit-msg.mjs /tmp/commit-msg
          done
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Commit format (commitlint)
        if: github.event_name == 'pull_request' && hashFiles('package-lock.json') != ''
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      # test:notifications and test:widgets join this list when their tracks implement them;
      # until then they exit 1 on purpose.
      - name: Lint, types, tests, dead code
        if: hashFiles('package-lock.json') != ''
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run deadcode
      # Gradle costs about 6 minutes cold, so it runs only when the Kotlin module, the lockfile (Expo and React
      # Native versions) or this workflow changed. Base: the PR base, or the commit before the push
      # (github.event.before); a missing base (new branch, manual run) runs it.
      # https://docs.github.com/en/webhooks/webhook-events-and-payloads#push
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands (GITHUB_OUTPUT)
      - name: Did the Kotlin capture module or its build inputs change?
        id: kotlin
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "${BASE}^0" > /dev/null \
            || git diff --name-only "$BASE" HEAD -- apps/mobile/modules/lumen-capture/android/ \
              package-lock.json .github/workflows/ci.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # React Native's CMake configure step fails on JDK 25 (workspace ADR 0032), so Gradle runs on JDK 17.
      - uses: actions/setup-java@v6.0.1
        if: steps.kotlin.outputs.changed == 'true' && hashFiles('apps/mobile/app.config.ts') != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: lumen-capture JUnit (CAP-1)
        if: steps.kotlin.outputs.changed == 'true' && hashFiles('apps/mobile/app.config.ts') != ''
        working-directory: apps/mobile
        run: |
          npx expo prebuild --no-install --platform android
          cd android && ./gradlew :lumen-capture:testDebugUnitTest --console=plain
      - name: i18n keys match in English and Spanish (UI-2)
        if: hashFiles('package-lock.json') != ''
        run: npm run i18n:check
      - name: No hard-coded user-facing strings (UI-2, SAFE-1)
        if: hashFiles('package-lock.json') != ''
        run: npm run lint:strings
      # npm test already runs this; a separate step makes EVID-1 visible in the CI summary.
      - name: Evidence labels (EVID-1)
        if: hashFiles('package-lock.json') != ''
        run: npm run test:evidence
      - name: Golden parity, TypeScript vs Python (DSP-C)
        if: hashFiles('package-lock.json') != ''
        run: npm run golden:check
      - name: Synthetic suite (DSP-D)
        if: hashFiles('package-lock.json') != ''
        run: npm run test:synthetic
      - name: README tested-devices table matches devices.json
        if: hashFiles('package-lock.json') != ''
        run: npm run devices:table -- --check
      - name: Red-team suite (§16)
        if: hashFiles('package-lock.json') != ''
        run: npm run test:redteam
      - name: Expo prebuild smoke test
        if: hashFiles('apps/mobile/app.config.ts') != ''
        working-directory: apps/mobile
        # Expo skips iOS prebuild on Windows, so CI (Linux) is where the generated iOS project is checked.
        # ios/*/ because the folder follows the swappable display name (spec §2).
        run: |
          npx expo prebuild --no-install --clean --platform all
          grep -q NSCameraUsageDescription ios/*/Info.plist
          grep -q NSCameraUsageDescription ios/*/Supporting/es.lproj/InfoPlist.strings
          grep -q android.permission.CAMERA android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.camera.flash" android:required="false"' android/app/src/main/AndroidManifest.xml
          grep -q aps-environment ios/*/*.entitlements
          # §9.5: the strap's Bluetooth keeps its own purpose text (ble-plx otherwise writes a generic default)
          # and never asks for location (ADR 0039).
          grep -A1 NSBluetoothAlwaysUsageDescription ios/*/Info.plist | grep -q 'Used only in Lab mode to compare Lumen with a heart-rate chest strap.'
          grep -q 'android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"' android/app/src/main/AndroidManifest.xml
      - name: Expo prebuild smoke test, free Apple ID mode (ADR 0034)
        if: hashFiles('apps/mobile/app.config.ts') != ''
        working-directory: apps/mobile
        env:
          LUMEN_IOS_PERSONAL_TEAM: '1'
        # Without LUMEN_IOS_TEAM_ID no team is preset, so expo run:ios picks one; with it, the team is set.
        run: |
          npx expo prebuild --no-install --clean --platform ios
          test -f ios/*/*.entitlements
          # Bash's -e ignores a failing "! cmd", so the absence checks need an explicit exit.
          if grep -q aps-environment ios/*/*.entitlements; then exit 1; fi
          if grep -Eq 'DEVELOPMENT_TEAM = "?[A-Z0-9]{10}"?;' ios/*.xcodeproj/project.pbxproj; then exit 1; fi
          grep -Eq 'PRODUCT_BUNDLE_IDENTIFIER = "?io\.github\.shravanvasa2009\.heartcheck\.dev"?;' ios/*.xcodeproj/project.pbxproj
          grep -q NSCameraUsageDescription ios/*/Info.plist
          LUMEN_IOS_TEAM_ID=ABCDE12345 npx expo prebuild --no-install --clean --platform ios
          if grep -q aps-environment ios/*/*.entitlements; then exit 1; fi
          grep -Eq 'DEVELOPMENT_TEAM = "?ABCDE12345"?;' ios/*.xcodeproj/project.pbxproj

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        if: hashFiles('ml/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v5 # VERIFY: current major version
      - name: Tests and lint
        if: hashFiles('ml/pyproject.toml') != ''
        working-directory: ml
        run: |
          uv sync
          uv run ruff check .
          # Exit 5 means "no tests collected" (owner decision 2026-09-30, until Track D adds tests);
          # every other non-zero exit still fails.
          uv run pytest || [ $? -eq 5 ]
      - name: Golden vectors reproduce from lumen_dsp (DSP-C)
        if: hashFiles('ml/pyproject.toml') != ''
        working-directory: ml
        run: uv run python -m lumen_dsp.golden --check

  e2e-android:
    # UI flows on an Android emulator (Maestro) against a release APK; nothing here uses the camera.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The release build plus the emulator system image overflow the runner's disk ("No space left on
      # device" in run 36816700825), so drop preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # React Native's Android build supports JDK 17; newer JDKs break the CMake configure step.
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: npm ci
      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Built before the emulator boots so the emulator isn't competing with Gradle for memory.
      - name: Build release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild -p android --no-install
          cd android && ./gradlew app:assembleRelease -PreactNativeArchitectures=x86_64
      # Snippet from the android-emulator-runner README; the emulator needs KVM to boot in reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # The default profile boots at 320x640 dp (run 37045872239 logs 320x640, 160 dpi). Lumen's
          # scrolling screens then keep buttons and rows below the fold, where Maestro cannot see or tap
          # them (it does not scroll).
          profile: pixel_6
          # On failure, keep the whole device log next to Maestro's output (its own log covers one flow).
          script: npm run e2e:android || (adb logcat -d > "$HOME/.maestro/tests/logcat.txt"; exit 1)
      # Maestro saves a screenshot and the view hierarchy for each failed step under ~/.maestro/tests; CI
      # failures were otherwise text-only. https://github.com/actions/upload-artifact
      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: ~/.maestro/tests
          retention-days: 7
