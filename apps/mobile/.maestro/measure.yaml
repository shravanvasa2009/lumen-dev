# Same paths as the navigation tests in src/routes.test.tsx: measurement to results and emergency, the
# report, the explanation, and the Fix my technique loop. The emulator has no flash, so the capture
# screen is only passed through, never measured. Text is a regex, so ( ) ? . are escaped.
appId: io.github.shravanvasa2009.heartcheck
name: Home through a measurement to results, emergency, report, why, and fix-technique
---
# Capture and Practice ask for the camera, and Reminders for notifications (Android 13+); granting both at
# launch keeps the Android dialogs off the screen.
# https://docs.maestro.dev/api-reference/commands/launchapp
# A late teardown of the previous flow's app can kill the new launch (run 37060488120: 'Killing ...
# remove task' 26 ms after start), so only the launch and the first wait are retried.
# https://docs.maestro.dev/reference/commands-available/retry
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            notifications: allow
      # launchApp returns before the JavaScript has loaded; a link sent then is dropped. A fresh install
      # opens on Welcome (the onboarding gate), so wait for that, then finish onboarding to reach Home.
      - extendedWaitUntil:
          visible: 'Get started'
          timeout: 60000
- runFlow: subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: 'Change mode'
    timeout: 60000
- openLink: lumen://
- tapOn: 'Measure'
- assertVisible: 'Choose a mode'
- tapOn: 'Quick Check'
- assertVisible: 'Before you start'
- tapOn: 'Start reading'
- assertVisible: 'Quick Check'
# Capture ends only on clean seconds, which the emulator cannot produce, so open the next screen by link.
# The capture just started is kept with 0 clean seconds, so Analyzing hands it to Inconclusive (#239);
# processing.test.tsx covers the Analyzing title and See a sample result.
- openLink: lumen://measure/processing
- assertVisible: 'Not enough clean signal'
- openLink: lumen://results/demo
- assertVisible: 'Results'
# The demo reading has no heart-rate or rhythm flag, so the safety question comes from the flagged one.
- openLink: lumen://results/demo-flag
- assertVisible: 'Quick safety check'
- tapOn: 'Yes'
- assertVisible: 'Get help now'
- openLink: lumen://results/demo
# Share and Show me why are pinned below the cards, so they are visible without scrolling.
- tapOn: 'Share'
- assertVisible: 'Doctor report'
- openLink: lumen://results/demo
- tapOn: 'Show me why'
# The destination's title; the curly quotes around "regular" are matched with dots.
- assertVisible: 'Why .regular.\?'
- openLink: lumen://measure/capture?mode=quick
- tapOn: 'Stop reading'
- assertVisible: 'Not enough clean signal'
- tapOn: 'Fix my technique \(2 min\)'
- assertVisible: 'Fix my technique'
- tapOn: 'Done — take a reading'
- assertVisible: 'Quick Check'
