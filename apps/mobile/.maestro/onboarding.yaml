# Same chain as the 'walks the onboarding chain' test in src/routes.test.tsx, on a real Android runtime.
appId: io.github.shravanvasa2009.heartcheck
name: Onboarding from welcome to Home
---
# Capture and Practice ask for the camera, and Reminders for notifications (Android 13+). Granting both at
# launch keeps the system dialogs off the screen, so a late dialog can't cover Home at the end.
# Android grants notifications silently: https://docs.maestro.dev/llms-full.txt (setPermissions)
# A late teardown of the previous flow's app can kill the new launch (run 37060488120: 'Killing ...
# remove task' 26 ms after start), so only the launch and the first wait are retried.
# https://docs.maestro.dev/reference/commands-available/retry
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            notifications: allow
      # launchApp returns before the JavaScript has loaded; a link sent then is dropped, so wait for Home first.
      - extendedWaitUntil:
          visible: 'Change mode'
          timeout: 60000
- openLink: lumen://welcome
- assertVisible: 'Get started'
- tapOn: 'Get started'
- assertVisible: "What Lumen is — and isn't"
- tapOn: 'I understand Lumen is a screening tool, not a diagnosis.'
- tapOn: 'Continue'
- assertVisible: 'About you'
- tapOn: 'Enter age'
- inputText: '42'
- hideKeyboard
- tapOn: 'Continue'
- assertVisible: 'Checking your phone'
- tapOn: 'Next: finger placement'
- assertVisible: 'Where your finger goes'
- tapOn: "I'm ready — start practice"
- assertVisible: 'Practice reading'
- tapOn: 'Continue'
- assertVisible: 'How to sit'
- tapOn: 'Continue'
- assertVisible: 'Your Lumen rating'
- tapOn: 'Continue'
- assertVisible: 'Reminders'
- tapOn: 'Turn on reminders'
- assertVisible: 'Change mode'
