- assertVisible: 'Standing heart-rate test'
- openLink: lumen://report/demo
- assertVisible: 'Doctor report'
- openLink: lumen://learn/what-is-afib
- assertVisible: 'What is AFib — and why it matters'
- openLink: lumen://settings/phone
- assertVisible: 'Your phone'
- openLink: lumen://settings/lab
- assertVisible: 'Lab mode'
- openLink: lumen://measure/fix-technique
- assertVisible: 'Fix my technique'
- openLink: lumen://settings/accuracy
- assertVisible: 'How accurate is Lumen\?'
- openLink: lumen://settings/appearance
- assertVisible: 'Appearance'
