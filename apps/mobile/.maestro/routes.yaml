# The Care map asks for location when it opens. Denying it must leave the ZIP or city search on screen.
- openLink: lumen://care
- tapOn:
    text: 'Don.t allow'
    optional: true
- assertVisible: 'Care near you'
- assertVisible: 'Location is off\. Enter a ZIP code or city to see clinics near it\.'
- assertVisible: 'ZIP code or city'
# A whole ZIP code moves the map there at once; the map must stay on screen while the field is in use.
- tapOn: 'ZIP code or city'
# Typing while the keyboard still slid in doubled the first digit on the API 37 emulator (2026-10-03).
- waitForAnimationToEnd
- inputText: '77002'
- assertVisible:
    id: 'care-map-frame'
- assertVisible: 'Showing clinics near 77002'
