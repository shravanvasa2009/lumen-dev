# Walks a fresh install from Welcome to Home through the real screens, the same steps onboarding.yaml
# asserts one by one. Run it right after launchApp with clearState: true, camera and notifications allowed.
# Home sends a fresh install to Welcome (the onboarding gate), so every other flow needs this first.
# https://docs.maestro.dev/api-reference/commands/runflow
appId: io.github.shravanvasa2009.heartcheck
---
- tapOn: 'Get started'
- tapOn: 'I understand Lumen is a screening tool, not a diagnosis.'
- tapOn: 'Continue'
- tapOn: 'Enter age'
- inputText: '42'
- hideKeyboard
- tapOn: 'Next'
- tapOn: 'Continue'
- tapOn: 'Next: finger placement'
- tapOn: "I'm ready — start practice"
- tapOn: 'Continue'
- tapOn: 'Continue'
- tapOn: 'Continue'
- tapOn: 'Turn on reminders'
- extendedWaitUntil:
    visible: 'Change mode'
    timeout: 20000
