[project]
name = "lumen-ml"
version = "0.1.0"
description = "Lumen datasets, training, export, and evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lightgbm==4.7.0",
    "numpy==2.4.6",
    "onnx==1.23.1",
    "onnxmltools==1.16.0",
    "onnxruntime==1.30.0",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "torch==2.14.1",
    "vitaldb==1.7.2",
    "wfdb==4.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "lumen_dsp/tests"]
